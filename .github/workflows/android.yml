name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      - name: using docker
        uses: docker://docker.io/circleci/android:api-29-node

      - name: setup android licenses
        run: echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > sudo ${ANDROID_HOME}/licenses/android-sdk-license

      - name: setup android licenses (2)
        run: echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > sudo ${ANDROID_HOME}/licenses/android-sdk-license

      - name: Build with Gradle
        run: ./gradlew build
